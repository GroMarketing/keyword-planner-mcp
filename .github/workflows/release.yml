name: release
# Publishes to npm when a version tag (v1.2.3) is pushed. No npm token exists anywhere:
# npm trusts this workflow through OIDC (trusted publishing) and attaches provenance.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Tag must match package.json version
        if: github.event_name == 'push'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Skip if this version is already on npm
        id: check
        run: |
          v=$(node -p "require('./package.json').name + '@' + require('./package.json').version")
          if npm view "$v" version >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != 'true'
        run: npm publish --provenance --access public
